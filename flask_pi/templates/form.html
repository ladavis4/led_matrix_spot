<form action="/" method = "POST">
    <p>ON/OFF <input type = "checkbox" name = "button_on" value="true" id="button5"/></p>
    <p>Display Pictures <input type = "checkbox" name = "button_img" value="true" id="button1"/></p>
    <p>Display Weather <input type = "checkbox" name = "button_time" value="true" id="button2"/></p>
    <p>Display Calendar <input type = "checkbox" name = "button_cal" value="true" id="button3"/></p>
    <p>Display Spotify <input type = "checkbox" name = "button_spot" value="true" id="button4"/></p>
    <p>Brightness <input type = "range" name = "slider_brightness" value=100 min="1" max="100" id="slider"/></p>
    <p>City Latitude <input type = "number" name = "lat" value = "0" step = "0.0001" id="num_lat"/></p>
    <p>City Longitude <input type = "number" name = "long" value = "0" step = "0.0001" id="num_long"/></p>
    <p>City Name (optional) <input type = "text" name = "city_name" id="cty_name"/></p>
    <p><input type = "submit" value = "Submit" /></p>
</form>


<script>

window.onload = function() {
    var but_on = '{{data.button_on}}';
    var but_img = '{{data.button_img}}';
    var but_weather = '{{data.button_time}}';
    var but_cal = '{{data.button_cal}}';
    var but_spot = '{{data.button_spot}}';
    var sld_brightness = '{{data.slider_brightness}}';
    var lat = '{{data.lat}}';
    var long = '{{data.long}}';
    var city_name = '{{data.city_name}}';

    document.getElementById("slider").value = sld_brightness;
    document.getElementById("num_lat").value = lat;
    document.getElementById("num_long").value = long;
    document.getElementById("cty_name").value = city_name;


    if(but_img=='True'){
        document.getElementById("button1").checked = true;
    }
    if(but_weather=='True'){
        document.getElementById("button2").checked = true;
    }
    if (but_cal=='True'){
        document.getElementById("button3").checked = true;
    }
    if (but_spot=='True'){
        document.getElementById("button4").checked = true;
    }
    if(but_on=='True'){
        document.getElementById("button5").checked = true;
    }
};
</script>
